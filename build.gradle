plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'com.sccadd'
version = '0.1.0'
base {
    archivesName = 'sccadd'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = '21.1.251'

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        sccadd {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    // Compile against the exact mods of the test instance.
    compileOnly files('libs/scc-1.4.0.jar', 'libs/appliedenergistics2-19.2.18.jar')

    // For dev runs: the same jars plus AE2's dependencies (GuideME, sodium only client-visible).
    runtimeOnly files(
            'libs/scc-1.4.0.jar',
            'libs/appliedenergistics2-19.2.18.jar',
            'libs/guideme-21.1.19.jar'
    )
}

// Make sure the runtime mods folder gets the dependency jars for local test runs.
// The client gets everything; the dedicated server must not see client-only mods.
def clientOnlyMods = [
        'sodium-*.jar',
        'sodium-extra-*.jar',
        'Controlling-*.jar',
        'Searchables-*.jar',
        'Jade-*.jar',
        'ferritecore-*.jar',
        'jei-*.jar'
]

tasks.register('copyClientMods', Sync) {
    from 'libs'
    include '*.jar'
    into layout.projectDirectory.dir('run/mods')
}

tasks.register('copyServerMods', Sync) {
    from 'libs'
    include '*.jar'
    exclude clientOnlyMods
    into layout.projectDirectory.dir('run/mods')
}

tasks.matching { it.name == 'runClient' || it.name == 'prepareClientRun' }.configureEach {
    dependsOn 'copyClientMods'
}

tasks.matching { it.name == 'runServer' || it.name == 'prepareServerRun' }.configureEach {
    dependsOn 'copyServerMods'
}

// Expand ${version} and friends inside neoforge.mods.toml (FML does not understand them).
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            version     : project.version,
            mod_id      : 'sccadd',
            mod_name    : 'Super Cool Additions',
            mod_authors : 'MiguelSP',
            mod_license : 'MIT'
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties + [project: project]
    }
}
