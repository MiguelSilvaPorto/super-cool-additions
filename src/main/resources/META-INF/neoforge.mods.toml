modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

[[mods]]
modId = "sccadd"
version = "${version}"
displayName = "Super Cool Additions"
authors = "MiguelSP"
description = '''
An addon for SCC - Super Cool Calculator.

Breaking Calculator: a hard time budget per tick and a batch mode that learns the
real drops and credits whole stacks of blocks at once.

AE2: SCC recipes become real AE2 patterns, AE2 patterns show their ingredients in
SCC, the Wireless Receiver bridges both networks (items, fluids), and the Inscriber
and Charger recipes are known to SCC. Reusable presses stay in the machine.

Requester: typed stock/order/time fields, production chains (draggable boxes, recipes
and arrows run round and round without the planner), and a Think button that plans
big orders in the background.

Terminal and tools: advanced filter, clean variants, drag-to-edit bar, pocket terminal
panel with per-slot export/import rules, magnet range, Interface fluid tanks, and a
Processing Calculator that can act as a machine of your choice.
'''

[[mixins]]
config = "sccadd.mixins.json"

[[dependencies.sccadd]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.sccadd]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1]"
ordering = "NONE"
side = "BOTH"

[[dependencies.sccadd]]
modId = "scc"
type = "required"
versionRange = "[1.4.0,1.5.0)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.sccadd]]
modId = "ae2"
type = "optional"
versionRange = "[19.0.0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.sccadd]]
modId = "easy_villagers"
type = "optional"
versionRange = "[1.1.0,)"
ordering = "AFTER"
side = "BOTH"
